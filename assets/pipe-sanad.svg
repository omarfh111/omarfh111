<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="Sanad voice-first accessible service architecture">
  <defs>
    <linearGradient id="bg"><stop stop-color="#12091E"/><stop offset="1" stop-color="#1A0E28"/></linearGradient>
    <linearGradient id="acc"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="230" rx="14" fill="#0B0714"/>
  <rect width="1200" height="3" fill="url(#acc)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="28" y="34" fill="#C084FC" font-size="11" font-weight="700" letter-spacing="2">VOICE-FIRST INCLUSIVE JOURNEY</text>
    <text x="1172" y="34" text-anchor="end" fill="#6B4C7A" font-size="10">zero-click path · confirmation before sensitive action</text>
    <g fill="url(#bg)" stroke="#3B214F">
      <rect x="28" y="62" width="145" height="92" rx="12"/>
      <rect x="205" y="62" width="170" height="92" rx="12"/>
      <rect x="407" y="62" width="155" height="92" rx="12"/>
      <rect x="594" y="62" width="160" height="92" rx="12"/>
      <rect x="786" y="62" width="165" height="92" rx="12"/>
      <rect x="983" y="62" width="189" height="92" rx="12" stroke="#F43F5E"/>
    </g>
    <g text-anchor="middle">
      <text x="100" y="95" fill="#F8F7FC" font-size="13" font-weight="700">VOICE INPUT</text><text x="100" y="120" fill="#9D8BAC" font-size="11">French · Derja</text><text x="100" y="137" fill="#9D8BAC" font-size="10">always-listening mode</text>
      <text x="290" y="95" fill="#C084FC" font-size="13" font-weight="700">ACCESS PROFILE</text><text x="290" y="120" fill="#9D8BAC" font-size="11">vision · hearing · text</text><text x="290" y="137" fill="#9D8BAC" font-size="10">adaptive WCAG UX</text>
      <text x="484" y="95" fill="#F8F7FC" font-size="13" font-weight="700">INTENT AGENT</text><text x="484" y="120" fill="#9D8BAC" font-size="11">LangGraph routing</text><text x="484" y="137" fill="#9D8BAC" font-size="10">context + correction</text>
      <text x="674" y="95" fill="#F8F7FC" font-size="13" font-weight="700">BANK + STORE</text><text x="674" y="120" fill="#9D8BAC" font-size="11">balance · transfer · cart</text><text x="674" y="137" fill="#9D8BAC" font-size="10">budget-aware tools</text>
      <text x="868" y="95" fill="#FB7185" font-size="13" font-weight="700">CONFIRMATION</text><text x="868" y="120" fill="#9D8BAC" font-size="11">repeat sensitive action</text><text x="868" y="137" fill="#9D8BAC" font-size="10">user stays in control</text>
      <text x="1077" y="95" fill="#FB7185" font-size="13" font-weight="700">ACCESSIBLE OUTPUT</text><text x="1077" y="120" fill="#9D8BAC" font-size="11">speech · captions · LSF</text><text x="1077" y="137" fill="#9D8BAC" font-size="10">multimodal feedback</text>
    </g>
    <path d="M173 108H205M375 108H407M562 108H594M754 108H786M951 108H983" stroke="#6B4C7A" stroke-width="2" stroke-dasharray="5 6">
      <animate attributeName="stroke-dashoffset" values="0;-22" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <circle r="5" fill="#F8F7FC" filter="url(#glow)">
      <animateMotion dur="5.5s" repeatCount="indefinite" path="M173 108H983"/>
      <animate attributeName="fill" values="#A855F7;#F43F5E;#A855F7" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(28 181)">
      <rect width="153" height="29" rx="14" fill="#321322"/><text x="76" y="19" text-anchor="middle" fill="#FB7185" font-size="10" font-weight="700">TOP 2 · MARATECH</text>
      <rect x="165" width="145" height="29" rx="14" fill="#321322"/><text x="237" y="19" text-anchor="middle" fill="#F8F7FC" font-size="10" font-weight="700">TOP 1 TECHNICAL</text>
      <rect x="322" width="136" height="29" rx="14" fill="#26123A"/><text x="390" y="19" text-anchor="middle" fill="#C084FC" font-size="10">VOICE-FIRST</text>
      <rect x="470" width="125" height="29" rx="14" fill="#26123A"/><text x="532" y="19" text-anchor="middle" fill="#C084FC" font-size="10">WCAG 2.1</text>
    </g>
  </g>
</svg>

