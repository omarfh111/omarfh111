<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Omar Fkih Hassen — dependable AI systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0714"/><stop offset=".62" stop-color="#160D24"/><stop offset="1" stop-color="#251022"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#A855F7"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#C084FC" opacity=".11"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)"/>
    <path d="M0 311H375L428 258H663L724 319H1200" fill="none" stroke="#A855F7" stroke-opacity=".14" stroke-width="2"/>
    <path d="M0 329H399L446 282H638L700 344H1200" fill="none" stroke="#F43F5E" stroke-opacity=".11" stroke-width="2"/>
    <rect x="0" width="13" height="360" fill="url(#signal)"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="58" y="70" fill="#C084FC" font-size="13" font-weight="700" letter-spacing="4">DEPENDABLE AI · TUNIS</text>
    <text x="58" y="143" fill="#F8F7FC" font-size="52" font-weight="750">Omar Fkih Hassen</text>
    <text x="58" y="190" fill="#C5B8D1" font-size="23">I engineer the boundary between model reasoning and real-world action.</text>
    <g transform="translate(58 232)">
      <rect width="146" height="38" rx="19" fill="#160D24" stroke="#3B214F"/><circle cx="21" cy="19" r="5" fill="#A855F7"/><text x="36" y="24" fill="#E9E2EF" font-size="12" font-weight="650">EVIDENCE FIRST</text>
      <rect x="158" width="166" height="38" rx="19" fill="#160D24" stroke="#3B214F"/><circle cx="179" cy="19" r="5" fill="#F43F5E"/><text x="194" y="24" fill="#E9E2EF" font-size="12" font-weight="650">POLICY IN CODE</text>
      <rect x="336" width="171" height="38" rx="19" fill="#160D24" stroke="#3B214F"/><circle cx="357" cy="19" r="5" fill="#A855F7"/><text x="372" y="24" fill="#E9E2EF" font-size="12" font-weight="650">HUMAN AUTHORITY</text>
      <rect x="519" width="156" height="38" rx="19" fill="#160D24" stroke="#3B214F"/><circle cx="540" cy="19" r="5" fill="#F43F5E"/><text x="555" y="24" fill="#E9E2EF" font-size="12" font-weight="650">MEASURED PROOF</text>
    </g>
    <g transform="translate(855 45)">
      <circle cx="142" cy="132" r="118" fill="#160D24" stroke="#3B214F"/>
      <circle cx="142" cy="132" r="84" fill="none" stroke="#A855F7" stroke-opacity=".28" stroke-dasharray="3 10">
        <animateTransform attributeName="transform" type="rotate" from="0 142 132" to="360 142 132" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="142" cy="132" r="53" fill="#0B0714" stroke="#F43F5E" stroke-opacity=".55"/>
      <text x="142" y="125" text-anchor="middle" fill="#F8F7FC" font-size="27" font-weight="800">AI</text>
      <text x="142" y="149" text-anchor="middle" fill="#9D8BAC" font-size="10" letter-spacing="2">SYSTEMS</text>
      <g fill="#A855F7" filter="url(#glow)">
        <circle r="5"><animateMotion dur="8s" repeatCount="indefinite" path="M142 14a118 118 0 1 1-.1 0"/></circle>
      </g>
      <g fill="#F43F5E"><circle cx="31" cy="173" r="6"/><circle cx="241" cy="67" r="6"/><circle cx="213" cy="228" r="6"/></g>
      <g stroke="#5B416B" stroke-width="1"><path d="M37 170L91 151"/><path d="M235 72L185 102"/><path d="M207 223L174 175"/></g>
    </g>
    <text x="58" y="326" fill="#9D8BAC" font-size="13">agents · RAG · multimodal AI · deterministic guardrails · evaluation · observability</text>
  </g>
