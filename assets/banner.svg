<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Omar Fkih Hassen — AI Engineer</title>
  <desc id="desc">Dark blue banner with cyan and violet accents describing agentic AI, RAG and computer vision work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04111f"/>
      <stop offset="0.55" stop-color="#071a2b"/>
      <stop offset="1" stop-color="#0d1b3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36d1dc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#36d1dc" stop-opacity=".20"/>
      <stop offset="1" stop-color="#36d1dc" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="74" r="220" fill="url(#glow)"/>
  <circle cx="112" cy="272" r="145" fill="#8b5cf6" opacity=".10" filter="url(#soft)"/>
  <g opacity=".28" stroke="#36d1dc" fill="none">
    <path d="M875 65 950 108 950 194 875 237 800 194 800 108Z"/>
    <path d="M950 108 1033 62 1110 106 1110 194 1033 240 950 194"/>
    <circle cx="875" cy="65" r="6" fill="#36d1dc"/><circle cx="950" cy="108" r="6" fill="#8b5cf6"/>
    <circle cx="950" cy="194" r="6" fill="#36d1dc"/><circle cx="1033" cy="62" r="6" fill="#8b5cf6"/>
    <circle cx="1110" cy="194" r="6" fill="#36d1dc"/><circle cx="1033" cy="240" r="6" fill="#8b5cf6"/>
  </g>
  <rect x="72" y="58" width="86" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="127" fill="#f5fbff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Omar Fkih Hassen</text>
  <text x="74" y="174" fill="#9fdfea" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="25" font-weight="500">AI Engineer · Agentic Systems · RAG · Computer Vision</text>
  <text x="74" y="223" fill="#91a7bd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">Building grounded, observable and human-controlled AI products.</text>
</svg>


